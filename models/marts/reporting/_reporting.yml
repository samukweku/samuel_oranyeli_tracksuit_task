version: 2

models:
  - name: rpt_monthly_grr_by_customer_size
    description: Monthly GRR for the last 12 available revenue months; it fixes the cohort 12 months earlier and caps retained customer revenue at cohort revenue.
    columns:
      - name: report_month
        data_tests: [not_null]
      - name: customer_size_group
        data_tests: [not_null]
      - name: gross_revenue_retention_pct
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: 'between 0 and 100'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['report_month', 'customer_size_group']
