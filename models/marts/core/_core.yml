version: 2

models:
  - name: dim_customer
    description: Current customer dimension, resolving retired HubSpot IDs and retaining unmatched billing customers.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_size_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['Enterprise', 'Mid-Market', 'SMB', 'Startup', 'Unknown']
  - name: dim_date
    description: Calendar dimension spanning the subscription and invoice history in the raw extract.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: dim_subscription
    description: Subscription contract dimension, with customer identity resolved from the billing account's CRM reference.
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
  - name: fct_subscription_invoice
    description: Atomic invoice fact. One row per issued invoice, including voided invoices and a recognised-revenue flag for financial reporting.
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: invoice_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription')
                field: subscription_id
      - name: invoice_total_nzd
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
